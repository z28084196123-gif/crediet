<title>每週排班表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: settings (shifts, staff, coverage) above a staff × 7-day grid; checks under it. Grid scrolls sideways inside its card on phones. */
:root {
  --bg: #f3f5f7; --paper: #ffffff; --ink: #17212b; --muted: #5d6b78; --line: #d9e0e6; --soft: #eaeef2;
  --accent: #1d5b8f; --accent-soft: #e3edf6;
  --good: #23824f; --good-soft: #e2f2e8; --warn: #b26a00; --warn-soft: #fbefd9; --risk: #c2362f; --risk-soft: #fbe3e1;
  --s1: #e3edf6; --s1i: #1d5b8f; --s2: #e2f2e8; --s2i: #23824f; --s3: #efe6f7; --s3i: #6b3fa0; --s4: #fbefd9; --s4i: #8a5300;
  --f-display: "Noto Serif TC", "Songti TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --paper: #161e26; --ink: #e4eaf0; --muted: #93a2b0; --line: #2a3642; --soft: #1d2731;
    --accent: #6fa8dc; --accent-soft: #1a2d40;
    --good: #5cc48a; --good-soft: #15301f; --warn: #e6a23c; --warn-soft: #33270f; --risk: #f07068; --risk-soft: #3a1a18;
    --s1: #1a2d40; --s1i: #8cbbe6; --s2: #15301f; --s2i: #7fd3a2; --s3: #2a1f38; --s3i: #c3a2e8; --s4: #33270f; --s4i: #e6b35c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --paper: #161e26; --ink: #e4eaf0; --muted: #93a2b0; --line: #2a3642; --soft: #1d2731;
  --accent: #6fa8dc; --accent-soft: #1a2d40;
  --good: #5cc48a; --good-soft: #15301f; --warn: #e6a23c; --warn-soft: #33270f; --risk: #f07068; --risk-soft: #3a1a18;
  --s1: #1a2d40; --s1i: #8cbbe6; --s2: #15301f; --s2i: #7fd3a2; --s3: #2a1f38; --s3i: #c3a2e8; --s4: #33270f; --s4i: #e6b35c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.6rem, 4vw, 2.1rem); }
h2 { font-size: 1.05rem; font-weight: 700; }
.muted { color: var(--muted); }
.eyebrow { font-size: .74rem; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
header { border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.settings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start; }
@media (max-width: 900px) { .settings { grid-template-columns: minmax(0, 1fr); } }
input, select { font: inherit; font-size: .88rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); min-width: 0; width: 100%; }
input:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
input.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button { font: inherit; font-size: .85rem; padding: 7px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
button.primary:hover { color: var(--paper); filter: brightness(1.1); }
button.x { padding: 4px 8px; color: var(--muted); }
.shiftrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr) 56px; gap: 6px; align-items: center; }
.shiftrow .tag { text-align: center; }
.staffrow { display: grid; grid-template-columns: minmax(0, 1fr) 84px 34px; gap: 6px; align-items: center; }
.covrow { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: .9rem; }
.hd { display: grid; gap: 6px; font-size: .72rem; color: var(--muted); }
.tag { display: inline-block; min-width: 34px; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: .85rem; }
.t0 { background: var(--soft); color: var(--muted); }
.t1 { background: var(--s1); color: var(--s1i); } .t2 { background: var(--s2); color: var(--s2i); }
.t3 { background: var(--s3); color: var(--s3i); } .t4 { background: var(--s4); color: var(--s4i); }

.weekbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.weekbar .range { font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: center; }
th { font-size: .8rem; font-weight: 500; color: var(--muted); }
th .d { display: block; font-family: var(--f-num); font-size: .75rem; }
th.we, td.we { background: color-mix(in srgb, var(--soft) 60%, transparent); }
td.name, th.name { text-align: left; white-space: nowrap; font-weight: 500; padding-left: 8px; }
td.cell button { width: 100%; min-width: 52px; padding: 8px 2px; border: none; font-weight: 700; font-size: .95rem; }
td.cell button.bad { outline: 2px solid var(--risk); outline-offset: -2px; }
td.sum { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: .85rem; white-space: nowrap; }
td.sum.over { color: var(--risk); font-weight: 600; }
tr.cov td { font-family: var(--f-num); font-size: .8rem; color: var(--muted); border-bottom: none; padding-top: 2px; padding-bottom: 2px; }
tr.cov td.short { color: var(--risk); font-weight: 600; }
tr.cov td.lbl { text-align: left; padding-left: 8px; font-family: var(--f-body); }
.legend { font-size: .8rem; color: var(--muted); }

.lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 20px; align-items: start; }
@media (max-width: 820px) { .lower { grid-template-columns: minmax(0, 1fr); } }
.list { display: grid; }
.item { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.item:last-child { border-bottom: none; }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 6px; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.risk { background: var(--risk); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 12px 14px; border-radius: 4px; background: var(--bg); }
.kpi .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 1.3rem; font-weight: 600; }
.kpi .l { font-size: .8rem; color: var(--muted); }
.foot { font-size: .78rem; color: var(--muted); }

@media print {
  body { background: #fff; padding: 0; }
  .settings, .noprint, .lower { display: none !important; }
  .card { border: none; padding: 0; }
  table { min-width: 0; }
  td.cell button { background: none !important; color: #000 !important; outline: none !important; }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SHIFT SCHEDULE</div>
    <h1>每週排班表</h1>
    <p>點格子切換班別（休 → 早 → 中 → 晚 → 全 → 休）。自動檢查週工時、一例一休、輪班間隔 11 小時與每日人力是否足夠。資料只存在這台瀏覽器。</p>
  </header>

  <section class="settings">
    <div class="card">
      <h2>班別設定</h2>
      <div class="shiftrow hd"><span>代號</span><span>上班</span><span>下班</span><span>休息分</span></div>
      <div id="shifts" style="display:grid;gap:6px"></div>
    </div>
    <div class="card">
      <h2>員工</h2>
      <div class="staffrow hd"><span>姓名</span><span>時薪（元）</span><span></span></div>
      <div id="staff" style="display:grid;gap:6px"></div>
      <div class="btns"><button id="addStaff">＋ 新增員工</button></div>
    </div>
    <div class="card">
      <h2>每日最低人力</h2>
      <div id="cover" style="display:grid;gap:6px"></div>
      <div class="covrow"><label for="maxH">每週工時上限</label><input id="maxH" class="num" type="number" min="0" step="1"></div>
      <div class="foot">勞基法：正常工時每週 40 小時；每 7 日應有 2 日休息（一例一休）；輪班換班間隔至少 11 小時。</div>
    </div>
  </section>

  <section class="card">
    <div class="weekbar">
      <div class="btns noprint">
        <button id="prev" aria-label="上一週">◀ 上週</button>
        <button id="today">本週</button>
        <button id="next" aria-label="下一週">下週 ▶</button>
      </div>
      <div class="range" id="range"></div>
      <div class="btns noprint">
        <button id="copyPrev">複製上週</button>
        <button id="auto" class="primary">自動排班</button>
        <button id="clear">清空本週</button>
      </div>
    </div>
    <div class="scroll"><table id="grid"></table></div>
    <div class="btns noprint" style="justify-content:space-between">
      <span class="legend" id="legend"></span>
      <span class="btns"><button id="csv">匯出 CSV</button><button id="print">列印</button></span>
    </div>
  </section>

  <section class="lower">
    <div class="card">
      <h2>排班檢查</h2>
      <div class="list" id="checks"></div>
    </div>
    <div class="card">
      <h2>本週總計</h2>
      <div class="kpis" id="kpis"></div>
      <div class="foot">人事成本 = 時薪 × 實際工時（已扣休息），未含加班費、勞健保與獎金。</div>
    </div>
  </section>
</div>

<script>
(() => {
const KEY = "shift-schedule-v1";
const DAYS = ["一", "二", "三", "四", "五", "六", "日"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const DEFAULT = {
  shifts: [
    { code: "早", start: "08:00", end: "17:00", brk: 60 },
    { code: "中", start: "10:00", end: "19:00", brk: 60 },
    { code: "晚", start: "13:00", end: "22:00", brk: 60 },
    { code: "全", start: "08:00", end: "20:00", brk: 90 },
  ],
  staff: [
    { id: "a", name: "阿明", wage: 190 }, { id: "b", name: "小美", wage: 190 },
    { id: "c", name: "志強", wage: 200 }, { id: "d", name: "淑芬", wage: 190 },
    { id: "e", name: "建宏", wage: 210 }, { id: "f", name: "雅婷", wage: 190 },
  ],
  cover: [2, 1, 1, 0],   // minimum people per day for each shift
  maxH: 40,
  weeks: {},             // "YYYY-MM-DD" (Monday) -> { staffId: [7 shift indices, 0 = 休] }
};

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { S = null; }
if (!S || !Array.isArray(S.shifts)) S = structuredClone(DEFAULT);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---- dates ----
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
let wk = monday(new Date());
const wkKey = d => ymd(d);
const weekData = (d, create = true) => {
  const k = wkKey(d);
  if (!S.weeks[k] && create) S.weeks[k] = {};
  const w = S.weeks[k] || {};
  if (create) S.staff.forEach(p => { if (!w[p.id]) w[p.id] = [0, 0, 0, 0, 0, 0, 0]; });
  return w;
};

// ---- shift math ----
const mins = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const shiftSpan = i => { const s = S.shifts[i - 1]; let a = mins(s.start), b = mins(s.end); if (b <= a) b += 1440; return [a, b]; };
const shiftHours = i => { if (!i) return 0; const [a, b] = shiftSpan(i); return Math.max(0, (b - a - (+S.shifts[i - 1].brk || 0)) / 60); };
const fmtH = h => (Math.round(h * 10) / 10).toString();
const money = n => Math.round(n).toLocaleString("zh-TW");

// ---- settings UI ----
function renderSettings() {
  $("shifts").innerHTML = S.shifts.map((s, i) => `
    <div class="shiftrow">
      <span class="tag t${i + 1}">${esc(s.code)}</span>
      <input type="time" data-s="${i}" data-k="start" value="${esc(s.start)}" aria-label="${esc(s.code)}班上班時間">
      <input type="time" data-s="${i}" data-k="end" value="${esc(s.end)}" aria-label="${esc(s.code)}班下班時間">
      <input type="number" class="num" min="0" step="15" data-s="${i}" data-k="brk" value="${s.brk}" aria-label="${esc(s.code)}班休息分鐘">
    </div>`).join("");
  $("staff").innerHTML = S.staff.map((p, i) => `
    <div class="staffrow">
      <input data-p="${i}" data-k="name" value="${esc(p.name)}" aria-label="員工姓名">
      <input type="number" class="num" min="0" data-p="${i}" data-k="wage" value="${p.wage}" aria-label="${esc(p.name)} 時薪">
      <button class="x" data-del="${i}" aria-label="刪除 ${esc(p.name)}">✕</button>
    </div>`).join("");
  $("cover").innerHTML = S.shifts.map((s, i) => `
    <div class="covrow"><label for="cov${i}"><span class="tag t${i + 1}">${esc(s.code)}</span> ${esc(s.start)}–${esc(s.end)}</label>
    <input id="cov${i}" class="num" type="number" min="0" step="1" data-c="${i}" value="${S.cover[i] ?? 0}"></div>`).join("");
  $("maxH").value = S.maxH;
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.s !== undefined) { const s = S.shifts[+t.dataset.s]; s[t.dataset.k] = t.dataset.k === "brk" ? Math.max(0, +t.value || 0) : t.value; }
  else if (t.dataset.p !== undefined) { const p = S.staff[+t.dataset.p]; p[t.dataset.k] = t.dataset.k === "wage" ? Math.max(0, +t.value || 0) : t.value; }
  else if (t.dataset.c !== undefined) S.cover[+t.dataset.c] = Math.max(0, Math.floor(+t.value || 0));
  else if (t.id === "maxH") S.maxH = Math.max(0, +t.value || 0);
  else return;
  save(); renderGrid();
});
$("staff").addEventListener("click", e => {
  const i = e.target.dataset.del; if (i === undefined) return;
  const p = S.staff[+i];
  if (!confirm(`刪除「${p.name}」？（已排的班會一起移除）`)) return;
  S.staff.splice(+i, 1); Object.values(S.weeks).forEach(w => delete w[p.id]);
  save(); renderSettings(); renderGrid();
});
$("addStaff").onclick = () => {
  S.staff.push({ id: Math.random().toString(36).slice(2, 8), name: `員工${S.staff.length + 1}`, wage: 190 });
  save(); renderSettings(); renderGrid();
  const ins = $("staff").querySelectorAll('input[data-k="name"]'); ins[ins.length - 1]?.select();
};

// ---- analysis ----
function analyse() {
  const w = weekData(wk), prev = weekData(addDays(wk, -7), false), n = S.shifts.length;
  const out = { hours: {}, cost: 0, totalH: 0, bad: new Set(), issues: [], dayCount: [] };
  S.staff.forEach(p => {
    const row = w[p.id], h = row.reduce((a, i) => a + shiftHours(i), 0);
    out.hours[p.id] = h; out.totalH += h; out.cost += h * (+p.wage || 0);
    const off = row.filter(i => !i).length;
    if (h > S.maxH) out.issues.push(["risk", `${p.name} 本週 ${fmtH(h)} 小時，超過上限 ${S.maxH} 小時（超出 ${fmtH(h - S.maxH)} 小時需付加班費）。`]);
    if (off < 2) out.issues.push(["risk", `${p.name} 本週只休 ${off} 天，一例一休每 7 日至少要休 2 天。`]);
    // rest between consecutive shifts, including Sunday of the previous week → Monday
    const seq = [(prev[p.id] || [])[6] || 0, ...row];
    for (let d = 1; d <= 7; d++) {
      const a = seq[d - 1], b = seq[d];
      if (!a || !b || a > n || b > n) continue;
      const gap = (1440 + shiftSpan(b)[0]) - shiftSpan(a)[1];
      if (gap < 660) { out.bad.add(`${p.id}:${d - 1}`); out.issues.push(["risk", `${p.name} 週${DAYS[d - 1]}：前一班到這一班只隔 ${fmtH(gap / 60)} 小時，未滿 11 小時。`]); }
    }
  });
  for (let d = 0; d < 7; d++) {
    const c = S.shifts.map((_, i) => S.staff.filter(p => w[p.id][d] === i + 1 || (w[p.id][d] && covers(w[p.id][d], i + 1))).length);
    out.dayCount.push(c);
    S.shifts.forEach((s, i) => { const need = S.cover[i] || 0; if (c[i] < need) out.issues.push(["warn", `週${DAYS[d]} ${s.code}班 只有 ${c[i]} 人，需要 ${need} 人。`]); });
  }
  return out;
}
// A shift counts toward another shift's coverage when it spans that shift's whole time window (e.g. 全 covers 早 and 中).
function covers(have, need) {
  if (have === need) return true;
  const [a, b] = shiftSpan(have), [c, d] = shiftSpan(need);
  return a <= c && b >= d;
}

// ---- grid ----
function renderGrid() {
  const w = weekData(wk), r = analyse(), today = ymd(new Date());
  $("range").textContent = `${ymd(wk)} ～ ${ymd(addDays(wk, 6))}`;
  let h = `<thead><tr><th class="name">員工</th>`;
  for (let d = 0; d < 7; d++) {
    const dt = addDays(wk, d), we = d >= 5 ? " we" : "";
    h += `<th class="${we}"${ymd(dt) === today ? ' style="color:var(--accent);font-weight:700"' : ""}>週${DAYS[d]}<span class="d">${dt.getMonth() + 1}/${dt.getDate()}</span></th>`;
  }
  h += `<th>工時</th><th>休</th></tr></thead><tbody>`;
  S.staff.forEach(p => {
    const row = w[p.id], hrs = r.hours[p.id];
    h += `<tr><td class="name">${esc(p.name)}</td>`;
    row.forEach((i, d) => {
      const code = i ? S.shifts[i - 1]?.code ?? "?" : "休";
      h += `<td class="cell${d >= 5 ? " we" : ""}"><button class="t${i}${r.bad.has(`${p.id}:${d}`) ? " bad" : ""}" data-cell="${p.id}:${d}" aria-label="${esc(p.name)} 週${DAYS[d]}：${esc(code)}">${esc(code)}</button></td>`;
    });
    h += `<td class="sum${hrs > S.maxH ? " over" : ""}">${fmtH(hrs)}</td><td class="sum${row.filter(i => !i).length < 2 ? " over" : ""}">${row.filter(i => !i).length}</td></tr>`;
  });
  S.shifts.forEach((s, i) => {
    h += `<tr class="cov"><td class="lbl">${esc(s.code)}班人數 / 需</td>`;
    for (let d = 0; d < 7; d++) { const c = r.dayCount[d][i], need = S.cover[i] || 0; h += `<td class="${c < need ? "short" : ""}${d >= 5 ? " we" : ""}">${c}/${need}</td>`; }
    h += `<td></td><td></td></tr>`;
  });
  $("grid").innerHTML = h + "</tbody>";
  $("legend").innerHTML = `<span class="tag t0">休</span> ` + S.shifts.map((s, i) => `<span class="tag t${i + 1}">${esc(s.code)}</span> ${esc(s.start)}–${esc(s.end)}（${fmtH(shiftHours(i + 1))}h）`).join("　");

  $("checks").innerHTML = r.issues.length
    ? r.issues.map(([lv, t]) => `<div class="item"><span class="dot ${lv}"></span><div>${esc(t)}</div></div>`).join("")
    : `<div class="item"><span class="dot good"></span><div>本週排班沒有發現問題。</div></div>`;
  const shifts = S.staff.reduce((a, p) => a + w[p.id].filter(Boolean).length, 0);
  $("kpis").innerHTML = [
    [fmtH(r.totalH), "總工時（小時）"], [shifts, "總班數"],
    [money(r.cost), "預估人事成本（元）"], [r.issues.length, "待處理問題"],
  ].map(([v, l]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
}

$("grid").addEventListener("click", e => {
  const b = e.target.closest("[data-cell]"); if (!b) return;
  const [id, d] = b.dataset.cell.split(":"); const row = weekData(wk)[id];
  row[+d] = (row[+d] + 1) % (S.shifts.length + 1);
  save(); renderGrid();
  document.querySelector(`[data-cell="${id}:${d}"]`)?.focus();
});

// ---- week actions ----
$("prev").onclick = () => { wk = addDays(wk, -7); renderGrid(); };
$("next").onclick = () => { wk = addDays(wk, 7); renderGrid(); };
$("today").onclick = () => { wk = monday(new Date()); renderGrid(); };
$("clear").onclick = () => { if (confirm("清空本週所有排班？")) { delete S.weeks[wkKey(wk)]; save(); renderGrid(); } };
$("copyPrev").onclick = () => {
  const p = S.weeks[wkKey(addDays(wk, -7))];
  if (!p) { alert("上週沒有排班資料。"); return; }
  const w = weekData(wk); S.staff.forEach(s => { if (p[s.id]) w[s.id] = [...p[s.id]]; });
  save(); renderGrid();
};

// Greedy auto-schedule: for each day and shift, fill the minimum headcount with whoever has the fewest
// hours so far, while keeping 2 days off, the weekly cap and the 11-hour rest rule.
$("auto").onclick = () => {
  const w = weekData(wk);
  if (S.staff.some(p => w[p.id].some(Boolean)) && !confirm("自動排班會覆蓋本週現有的班表，確定？")) return;
  const prev = weekData(addDays(wk, -7), false);
  S.staff.forEach(p => w[p.id] = [0, 0, 0, 0, 0, 0, 0]);
  const hrs = Object.fromEntries(S.staff.map(p => [p.id, 0])), work = Object.fromEntries(S.staff.map(p => [p.id, 0]));
  const restOK = (p, d, i) => {
    const a = d ? w[p.id][d - 1] : (prev[p.id] || [])[6] || 0;
    if (a && a <= S.shifts.length && (1440 + shiftSpan(i)[0]) - shiftSpan(a)[1] < 660) return false;
    const b = d < 6 ? w[p.id][d + 1] : 0;
    if (b && (1440 + shiftSpan(b)[0]) - shiftSpan(i)[1] < 660) return false;
    return true;
  };
  for (let d = 0; d < 7; d++) {
    // fill longer shifts first so a 全 can cover 早/中 needs
    const order = S.shifts.map((_, i) => i + 1).sort((x, y) => shiftHours(y) - shiftHours(x));
    for (const i of order) {
      const have = () => S.staff.filter(p => w[p.id][d] && covers(w[p.id][d], i)).length;
      while (have() < (S.cover[i - 1] || 0)) {
        const cand = S.staff.filter(p => !w[p.id][d] && work[p.id] < 5 && hrs[p.id] + shiftHours(i) <= S.maxH && restOK(p, d, i))
          .sort((a, b) => (hrs[a.id] - hrs[b.id]) || (Math.random() - .5));
        if (!cand.length) break;
        const p = cand[0]; w[p.id][d] = i; hrs[p.id] += shiftHours(i); work[p.id]++;
      }
    }
  }
  save(); renderGrid();
};

// ---- export ----
$("csv").onclick = () => {
  const w = weekData(wk), r = analyse();
  const head = ["員工", ...DAYS.map((d, i) => { const dt = addDays(wk, i); return `週${d} ${dt.getMonth() + 1}/${dt.getDate()}`; }), "工時"];
  const rows = S.staff.map(p => [p.name, ...w[p.id].map(i => i ? S.shifts[i - 1].code : "休"), fmtH(r.hours[p.id])]);
  const csv = "﻿" + [head, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `排班表_${ymd(wk)}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("print").onclick = () => window.print();

renderSettings(); renderGrid();
})();
</script>
